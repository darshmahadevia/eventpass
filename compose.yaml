# Local Postgres for development:
#   docker compose up -d && npm run db:migrate && npm run dev
# Port 54432 avoids clashing with a Postgres already on 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: eventpass-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventpass
    ports:
      - "127.0.0.1:54432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventpass"]
      interval: 2s
      timeout: 3s
      retries: 20
